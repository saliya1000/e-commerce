version: '3.8'
services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/e_commerce?schema=public
      - RABBITMQ_URL=amqp://rabbitmq:5672
    volumes:
      - ./uploads:/app/uploads
      - ./server.cert:/app/server.cert:ro
      - ./server.key:/app/server.key:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: npm run start:migrate:prod

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
      - "443:443"
    volumes:
      - ./server.cert:/etc/nginx/ssl/server.cert:ro
      - ./server.key:/etc/nginx/ssl/server.key:ro
    depends_on:
      - api

  prisma-studio:
    build: .
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/e_commerce?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: npx prisma studio -n 0.0.0.0

volumes:
  postgres_data:
  rabbitmq_data:
